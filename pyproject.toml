[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pul-normalizer"
version = "0.2.0"
description = "Normalizes titles and descriptions of full-game videos on the PUL YouTube channel"
requires-python = ">=3.10"
dependencies = [
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.149",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pul-normalizer = "pul_normalizer.cli:main"

[tool.setuptools]
packages = ["pul_normalizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
